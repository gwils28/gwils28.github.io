<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 530' width='760' height='530' font-family='Inter, Helvetica, Arial, sans-serif' role='img' aria-label='Réconcilier, c’est projeter : OLS projette orthogonalement, MinT selon la forme des erreurs'>
<defs><marker id='fl' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='context-stroke'/></marker></defs>
<rect width='760' height='530' fill='#fcfcfb'/>
<text x='24' y='32' font-size='15' font-weight='600' fill='#0b0b0b'>Réconcilier, c’est projeter</text>
<text x='24' y='52' font-size='11.5' fill='#52514e'>Schéma en 2 dimensions : le vrai espace a m dimensions, le sous-espace cohérent en a nb</text>
<g transform='translate(0 120)'>
<line x1='60.0' y1='345.0' x2='700.0' y2='105.0' stroke='#1baf7a' stroke-width='3'/>
<text x='520' y='196' font-size='12.5' font-weight='600' fill='#12825a'>vecteurs cohérents</text>
<text x='520' y='212' font-size='11.5' fill='#52514e'>(toutes les sommes tombent juste)</text>
<g transform='translate(330.0 105.0) rotate(120.00)'>
<ellipse rx='189.5' ry='63.2' fill='#eb6834' fill-opacity='0.08' stroke='#eb6834' stroke-width='1.5'/>
<ellipse rx='104.2' ry='34.7' fill='none' stroke='#eb6834' stroke-width='1' stroke-dasharray='3 3'/>
</g>
<line x1='330.0' y1='105.0' x2='375.6' y2='226.6' stroke='#52514e' stroke-width='1.6' stroke-dasharray='6 4' marker-end='url(#fl)'/>
<line x1='330.0' y1='105.0' x2='262.7' y2='269.0' stroke='#2a78d6' stroke-width='2.2' marker-end='url(#fl)'/>
<circle cx='330.0' cy='105.0' r='6' fill='#0b0b0b'/>
<text x='344.0' y='97.0' font-size='13' font-weight='600' fill='#0b0b0b'>ŷ</text>
<text x='360.0' y='97.0' font-size='11.5' fill='#52514e'>prévisions de base, incohérentes</text>
<circle cx='375.6' cy='226.6' r='5.5' fill='#fcfcfb' stroke='#52514e' stroke-width='2'/>
<text x='387.6' y='252.6' font-size='12.5' font-weight='600' fill='#52514e'>ỹ OLS</text>
<text x='387.6' y='268.6' font-size='11.5' fill='#52514e'>projection orthogonale (W = I)</text>
<circle cx='262.7' cy='269.0' r='6' fill='#2a78d6'/>
<text x='262.7' y='311.0' font-size='12.5' font-weight='600' fill='#2a78d6' text-anchor='middle'>ỹ MinT</text>
<text x='262.7' y='327.0' font-size='11.5' fill='#52514e' text-anchor='middle'>premier point touché par</text>
<text x='262.7' y='342.0' font-size='11.5' fill='#52514e' text-anchor='middle'>les ellipses d’erreur (W)</text>
</g>
<text x='24' y='498' font-size='11.5' fill='#52514e'>En orange : les ellipses de la covariance W des erreurs de base. MinT se déplace surtout dans la direction</text>
<text x='24' y='514' font-size='11.5' fill='#52514e'>où les prévisions sont les moins fiables, et bouge peu celles qui sont précises.</text>
</svg>