<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="titre desc" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
<title id="titre">Ce qui survit à une compaction</title><desc id="desc">Dix éléments du contexte et leur sort après une compaction : réinjectés depuis le disque, réinjectés en partie, rechargés au prochain fichier correspondant, ou perdus.</desc>
<rect x="2" y="2" width="1196" height="796" rx="18" fill="#f4f6f3" stroke="#d5dbd2" stroke-width="2"/>
<text x="600.0" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#282c26">Ce qui survit à une compaction</text>
<text x="60" y="98" font-size="17" font-weight="600" fill="#282c26">Dans le contexte avant la compaction</text>
<text x="700" y="98" font-size="17" font-weight="600" fill="#282c26">Après la compaction</text>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#282c26"/></marker></defs>
