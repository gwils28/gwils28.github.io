<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="titre desc" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
  <title id="titre">La démarche : du protocole figé aux chiffres vérifiés</title>
  <desc id="desc">Huit étapes en serpentin : protocole figé dans SPEC.md, issue déclarée avec ce qui serait une surprise, expérience lancée par la CLI, résultats bruts dans results/, tables et figures générées, registre qui recalcule les 33 chiffres de la prose, CI qui échoue si une phrase est périmée, publication. En bas, les garde-fous mécaniques et le traitement des écarts et des résultats imprévus.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#282c26"/></marker>
    <marker id="fleche-verte" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6218"/></marker>
    <marker id="fleche-ambre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e99d16"/></marker>
    <marker id="fleche-terre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a84022"/></marker>
    <marker id="fleche-grise" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6356"/></marker>
  </defs>
  <rect x="2" y="2" width="1196" height="676" rx="18" fill="#f4f6f3" stroke="#d5dbd2" stroke-width="2"/>
  <rect x="30" y="40" width="255" height="138" rx="12" fill="#fdf3dc" stroke="#e99d16" stroke-width="2"/>
  <circle cx="56" cy="68" r="15" fill="#e99d16"/>
  <text x="56" y="73.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="82" y="74" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Protocole figé</text>
  <text x="48" y="106" text-anchor="start" font-size="13" fill="#5a6356" font-family="'IBM Plex Mono', Consolas, monospace">SPEC.md, 2 juillet</text>
  <text x="48" y="128" text-anchor="start" font-size="13.5" fill="#3b4338">questions, découpages, métriques</text>
  <text x="48" y="150" text-anchor="start" font-size="13.5" fill="#3b4338">jamais modifié pour un résultat</text>
  <rect x="325" y="40" width="255" height="138" rx="12" fill="#fdf3dc" stroke="#e99d16" stroke-width="2"/>
  <circle cx="351" cy="68" r="15" fill="#e99d16"/>
  <text x="351" y="73.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="377" y="74" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Issue déclarée</text>
  <text x="343" y="106" text-anchor="start" font-size="13.5" fill="#3b4338">la question, la mesure</text>
  <text x="343" y="128" text-anchor="start" font-size="13.5" fill="#3b4338">et « ce qui serait</text>
  <text x="343" y="150" text-anchor="start" font-size="13.5" fill="#3b4338">une surprise », avant tout code</text>
  <rect x="620" y="40" width="255" height="138" rx="12" fill="#ffffff" stroke="#54a630" stroke-width="2"/>
  <circle cx="646" cy="68" r="15" fill="#2e6218"/>
  <text x="646" y="73.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="672" y="74" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Expérience</text>
  <text x="638" y="106" text-anchor="start" font-size="13" fill="#5a6356" font-family="'IBM Plex Mono', Consolas, monospace">zonefleet run e4</text>
  <text x="638" y="128" text-anchor="start" font-size="13.5" fill="#3b4338">panel versionné, graines fixes</text>
  <text x="638" y="150" text-anchor="start" font-size="13.5" fill="#3b4338">17 expériences et variantes</text>
  <rect x="915" y="40" width="255" height="138" rx="12" fill="#ffffff" stroke="#54a630" stroke-width="2"/>
  <circle cx="941" cy="68" r="15" fill="#2e6218"/>
  <text x="941" y="73.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <text x="967" y="74" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Résultats bruts</text>
  <text x="933" y="106" text-anchor="start" font-size="13" fill="#5a6356" font-family="'IBM Plex Mono', Consolas, monospace">results/</text>
  <text x="933" y="128" text-anchor="start" font-size="13.5" fill="#3b4338">CSV et JSON, seule source</text>
  <text x="933" y="150" text-anchor="start" font-size="13.5" fill="#3b4338">des chiffres publiés</text>
  <rect x="915" y="250" width="255" height="138" rx="12" fill="#ffffff" stroke="#54a630" stroke-width="2"/>
  <circle cx="941" cy="278" r="15" fill="#2e6218"/>
  <text x="941" y="283.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>
  <text x="967" y="284" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Tables et figures</text>
  <text x="933" y="316" text-anchor="start" font-size="13" fill="#5a6356" font-family="'IBM Plex Mono', Consolas, monospace">make figures tables</text>
  <text x="933" y="338" text-anchor="start" font-size="13.5" fill="#3b4338">générées, jamais retouchées</text>
  <text x="933" y="360" text-anchor="start" font-size="13.5" fill="#3b4338">à la main</text>
  <rect x="620" y="250" width="255" height="138" rx="12" fill="#ffffff" stroke="#54a630" stroke-width="2"/>
  <circle cx="646" cy="278" r="15" fill="#2e6218"/>
  <text x="646" y="283.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">6</text>
  <text x="672" y="284" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Registre des chiffres</text>
  <text x="638" y="316" text-anchor="start" font-size="13" fill="#5a6356" font-family="'IBM Plex Mono', Consolas, monospace">check_claims.py</text>
  <text x="638" y="338" text-anchor="start" font-size="13.5" fill="#3b4338">recalcule les 33 chiffres</text>
  <text x="638" y="360" text-anchor="start" font-size="13.5" fill="#3b4338">cités dans la prose</text>
  <rect x="325" y="250" width="255" height="138" rx="12" fill="#ffffff" stroke="#54a630" stroke-width="2"/>
  <circle cx="351" cy="278" r="15" fill="#2e6218"/>
  <text x="351" y="283.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">7</text>
  <text x="377" y="284" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Intégration continue</text>
  <text x="343" y="316" text-anchor="start" font-size="13.5" fill="#3b4338">tests, liens, textes alternatifs</text>
  <text x="343" y="338" text-anchor="start" font-size="13.5" fill="#3b4338">échoue si une phrase</text>
  <text x="343" y="360" text-anchor="start" font-size="13.5" fill="#3b4338">est périmée</text>
  <rect x="30" y="250" width="255" height="138" rx="12" fill="#ffffff" stroke="#54a630" stroke-width="2"/>
  <circle cx="56" cy="278" r="15" fill="#2e6218"/>
  <text x="56" y="283.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">8</text>
  <text x="82" y="284" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Publication</text>
  <text x="48" y="316" text-anchor="start" font-size="13.5" fill="#3b4338">site Quarto, notebooks</text>
  <text x="48" y="338" text-anchor="start" font-size="13.5" fill="#3b4338">article de veille</text>
  <text x="48" y="360" text-anchor="start" font-size="13.5" fill="#3b4338">version 1.0 archivée</text>
  <polyline points="285,109 323,109" fill="none" stroke="#282c26" stroke-width="2" marker-end="url(#fleche)"/>
  <polyline points="580,109 618,109" fill="none" stroke="#282c26" stroke-width="2" marker-end="url(#fleche)"/>
  <polyline points="875,109 913,109" fill="none" stroke="#282c26" stroke-width="2" marker-end="url(#fleche)"/>
  <polyline points="1042.5,178 1042.5,248" fill="none" stroke="#282c26" stroke-width="2" marker-end="url(#fleche)"/>
  <polyline points="915,319 877,319" fill="none" stroke="#282c26" stroke-width="2" marker-end="url(#fleche)"/>
  <polyline points="620,319 582,319" fill="none" stroke="#282c26" stroke-width="2" marker-end="url(#fleche)"/>
  <polyline points="325,319 287,319" fill="none" stroke="#282c26" stroke-width="2" marker-end="url(#fleche)"/>
  <rect x="30" y="420" width="1140" height="136" rx="12" fill="#ffffff" stroke="#b5beb1" stroke-width="2"/>
  <text x="50" y="450" text-anchor="start" font-size="16" font-weight="700" fill="#2e6218">Garde-fous mécaniques</text>
  <rect x="50" y="470" width="261" height="28" rx="14.0" fill="#e3efdc" stroke="#54a630" stroke-width="1.5"/>
  <text x="61" y="488.68" text-anchor="start" font-size="13" font-weight="500" fill="#2e6218">un hook protège les données brutes</text>
  <rect x="324.68" y="470" width="205" height="28" rx="14.0" fill="#e3efdc" stroke="#54a630" stroke-width="1.5"/>
  <text x="335.68" y="488.68" text-anchor="start" font-size="13" font-weight="500" fill="#2e6218">un test rouge bloque la CI</text>
  <rect x="543.2" y="470" width="275" height="28" rx="14.0" fill="#e3efdc" stroke="#54a630" stroke-width="1.5"/>
  <text x="554.2" y="488.68" text-anchor="start" font-size="13" font-weight="500" fill="#2e6218">lien mort ou image sans alt : refusé</text>
  <rect x="50" y="508" width="415" height="28" rx="14.0" fill="#e3efdc" stroke="#54a630" stroke-width="1.5"/>
  <text x="61" y="526.68" text-anchor="start" font-size="13" font-weight="500" fill="#2e6218">make release-check : zéro différence en conteneur vierge</text>
  <rect x="30" y="576" width="555" height="76" rx="12" fill="#f9e6df" stroke="#de7d5c" stroke-width="2"/>
  <text x="50" y="606" text-anchor="start" font-size="15" font-weight="700" fill="#a84022">Écart au protocole</text>
  <text x="50" y="630" text-anchor="start" font-size="13" fill="#3b4338">daté et justifié dans docs/notes/implementation.md</text>
  <rect x="615" y="576" width="555" height="76" rx="12" fill="#f9e6df" stroke="#de7d5c" stroke-width="2"/>
  <text x="635" y="606" text-anchor="start" font-size="15" font-weight="700" fill="#a84022">Résultat imprévu</text>
  <text x="635" y="630" text-anchor="start" font-size="13" fill="#3b4338">publié tel quel, étiqueté s'il vient après coup</text>
</svg>
