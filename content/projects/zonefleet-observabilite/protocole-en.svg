<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="titre desc" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
  <title id="titre">The approach: from a frozen protocol to verified figures</title>
  <desc id="desc">Eight steps in a snake: protocol frozen in SPEC.md, issue declared with what would be a surprise, experiment run by the CLI, raw results in results/, generated tables and figures, a registry that recomputes the 33 figures quoted in the prose, CI that fails if a sentence is stale, publication. At the bottom, the mechanical guardrails and how deviations and unexpected results are handled.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#282c26"/></marker>
    <marker id="fleche-verte" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6218"/></marker>
    <marker id="fleche-ambre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e99d16"/></marker>
    <marker id="fleche-terre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a84022"/></marker>
    <marker id="fleche-grise" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6356"/></marker>
  </defs>
  <rect x="2" y="2" width="1196" height="676" rx="18" fill="#f4f6f3" stroke="#d5dbd2" stroke-width="2"/>
  <rect x="30" y="40" width="255" height="138" rx="12" fill="#fdf3dc" stroke="#e99d16" stroke-width="2"/>
  <circle cx="56" cy="68" r="15" fill="#e99d16"/>
  <text x="56" y="73.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
  <text x="82" y="74" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Frozen protocol</text>
  <text x="48" y="106" text-anchor="start" font-size="13" fill="#5a6356" font-family="'IBM Plex Mono', Consolas, monospace">SPEC.md, 2 July</text>
  <text x="48" y="128" text-anchor="start" font-size="13.5" fill="#3b4338">questions, splits, metrics</text>
  <text x="48" y="150" text-anchor="start" font-size="13.5" fill="#3b4338">never changed for a result</text>
  <rect x="325" y="40" width="255" height="138" rx="12" fill="#fdf3dc" stroke="#e99d16" stroke-width="2"/>
  <circle cx="351" cy="68" r="15" fill="#e99d16"/>
  <text x="351" y="73.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
  <text x="377" y="74" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Declared issue</text>
  <text x="343" y="106" text-anchor="start" font-size="13.5" fill="#3b4338">the question, the measure</text>
  <text x="343" y="128" text-anchor="start" font-size="13.5" fill="#3b4338">and “what would be</text>
  <text x="343" y="150" text-anchor="start" font-size="13.5" fill="#3b4338">a surprise”, before any code</text>
  <rect x="620" y="40" width="255" height="138" rx="12" fill="#ffffff" stroke="#54a630" stroke-width="2"/>
  <circle cx="646" cy="68" r="15" fill="#2e6218"/>
  <text x="646" y="73.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
  <text x="672" y="74" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Experiment</text>
  <text x="638" y="106" text-anchor="start" font-size="13" fill="#5a6356" font-family="'IBM Plex Mono', Consolas, monospace">zonefleet run e4</text>
  <text x="638" y="128" text-anchor="start" font-size="13.5" fill="#3b4338">versioned panel, fixed seeds</text>
  <text x="638" y="150" text-anchor="start" font-size="13.5" fill="#3b4338">17 experiments and variants</text>
  <rect x="915" y="40" width="255" height="138" rx="12" fill="#ffffff" stroke="#54a630" stroke-width="2"/>
  <circle cx="941" cy="68" r="15" fill="#2e6218"/>
  <text x="941" y="73.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
  <text x="967" y="74" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Raw results</text>
  <text x="933" y="106" text-anchor="start" font-size="13" fill="#5a6356" font-family="'IBM Plex Mono', Consolas, monospace">results/</text>
  <text x="933" y="128" text-anchor="start" font-size="13.5" fill="#3b4338">CSV and JSON, the only</text>
  <text x="933" y="150" text-anchor="start" font-size="13.5" fill="#3b4338">source of published figures</text>
  <rect x="915" y="250" width="255" height="138" rx="12" fill="#ffffff" stroke="#54a630" stroke-width="2"/>
  <circle cx="941" cy="278" r="15" fill="#2e6218"/>
  <text x="941" y="283.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">5</text>
  <text x="967" y="284" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Tables and figures</text>
  <text x="933" y="316" text-anchor="start" font-size="13" fill="#5a6356" font-family="'IBM Plex Mono', Consolas, monospace">make figures tables</text>
  <text x="933" y="338" text-anchor="start" font-size="13.5" fill="#3b4338">generated, never touched</text>
  <text x="933" y="360" text-anchor="start" font-size="13.5" fill="#3b4338">by hand</text>
  <rect x="620" y="250" width="255" height="138" rx="12" fill="#ffffff" stroke="#54a630" stroke-width="2"/>
  <circle cx="646" cy="278" r="15" fill="#2e6218"/>
  <text x="646" y="283.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">6</text>
  <text x="672" y="284" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Figure registry</text>
  <text x="638" y="316" text-anchor="start" font-size="13" fill="#5a6356" font-family="'IBM Plex Mono', Consolas, monospace">check_claims.py</text>
  <text x="638" y="338" text-anchor="start" font-size="13.5" fill="#3b4338">recomputes the 33 figures</text>
  <text x="638" y="360" text-anchor="start" font-size="13.5" fill="#3b4338">quoted in the prose</text>
  <rect x="325" y="250" width="255" height="138" rx="12" fill="#ffffff" stroke="#54a630" stroke-width="2"/>
  <circle cx="351" cy="278" r="15" fill="#2e6218"/>
  <text x="351" y="283.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">7</text>
  <text x="377" y="284" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Continuous integration</text>
  <text x="343" y="316" text-anchor="start" font-size="13.5" fill="#3b4338">tests, links, alt texts</text>
  <text x="343" y="338" text-anchor="start" font-size="13.5" fill="#3b4338">fails if a sentence</text>
  <text x="343" y="360" text-anchor="start" font-size="13.5" fill="#3b4338">is stale</text>
  <rect x="30" y="250" width="255" height="138" rx="12" fill="#ffffff" stroke="#54a630" stroke-width="2"/>
  <circle cx="56" cy="278" r="15" fill="#2e6218"/>
  <text x="56" y="283.5" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">8</text>
  <text x="82" y="284" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Publication</text>
  <text x="48" y="316" text-anchor="start" font-size="13.5" fill="#3b4338">Quarto site, notebooks</text>
  <text x="48" y="338" text-anchor="start" font-size="13.5" fill="#3b4338">research post</text>
  <text x="48" y="360" text-anchor="start" font-size="13.5" fill="#3b4338">version 1.0 archived</text>
  <polyline points="285,109 323,109" fill="none" stroke="#282c26" stroke-width="2" marker-end="url(#fleche)"/>
  <polyline points="580,109 618,109" fill="none" stroke="#282c26" stroke-width="2" marker-end="url(#fleche)"/>
  <polyline points="875,109 913,109" fill="none" stroke="#282c26" stroke-width="2" marker-end="url(#fleche)"/>
  <polyline points="1042.5,178 1042.5,248" fill="none" stroke="#282c26" stroke-width="2" marker-end="url(#fleche)"/>
  <polyline points="915,319 877,319" fill="none" stroke="#282c26" stroke-width="2" marker-end="url(#fleche)"/>
  <polyline points="620,319 582,319" fill="none" stroke="#282c26" stroke-width="2" marker-end="url(#fleche)"/>
  <polyline points="325,319 287,319" fill="none" stroke="#282c26" stroke-width="2" marker-end="url(#fleche)"/>
  <rect x="30" y="420" width="1140" height="136" rx="12" fill="#ffffff" stroke="#b5beb1" stroke-width="2"/>
  <text x="50" y="450" text-anchor="start" font-size="16" font-weight="700" fill="#2e6218">Mechanical guardrails</text>
  <rect x="50" y="470" width="219" height="28" rx="14.0" fill="#e3efdc" stroke="#54a630" stroke-width="1.5"/>
  <text x="61" y="488.68" text-anchor="start" font-size="13" font-weight="500" fill="#2e6218">a hook protects the raw data</text>
  <rect x="282.56" y="470" width="162" height="28" rx="14.0" fill="#e3efdc" stroke="#54a630" stroke-width="1.5"/>
  <text x="293.56" y="488.68" text-anchor="start" font-size="13" font-weight="500" fill="#2e6218">a red test blocks CI</text>
  <rect x="458.96000000000004" y="470" width="303" height="28" rx="14.0" fill="#e3efdc" stroke="#54a630" stroke-width="1.5"/>
  <text x="469.96000000000004" y="488.68" text-anchor="start" font-size="13" font-weight="500" fill="#2e6218">dead link or image without alt: rejected</text>
  <rect x="50" y="508" width="373" height="28" rx="14.0" fill="#e3efdc" stroke="#54a630" stroke-width="1.5"/>
  <text x="61" y="526.68" text-anchor="start" font-size="13" font-weight="500" fill="#2e6218">make release-check: zero diff in a clean container</text>
  <rect x="30" y="576" width="555" height="76" rx="12" fill="#f9e6df" stroke="#de7d5c" stroke-width="2"/>
  <text x="50" y="606" text-anchor="start" font-size="15" font-weight="700" fill="#a84022">Protocol deviation</text>
  <text x="50" y="630" text-anchor="start" font-size="13" fill="#3b4338">dated and justified in docs/notes/implementation.md</text>
  <rect x="615" y="576" width="555" height="76" rx="12" fill="#f9e6df" stroke="#de7d5c" stroke-width="2"/>
  <text x="635" y="606" text-anchor="start" font-size="15" font-weight="700" fill="#a84022">Unexpected result</text>
  <text x="635" y="630" text-anchor="start" font-size="13" fill="#3b4338">published as is, labelled if added afterwards</text>
</svg>
