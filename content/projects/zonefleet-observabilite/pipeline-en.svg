  <text x="75" y="385.5" text-anchor="start" font-size="12.5" font-weight="500" fill="#79460c">✓ duplicates, caps</text>
  <rect x="64" y="400" width="238" height="22" rx="11.0" fill="#fdf3dc" stroke="#e99d16" stroke-width="1.5"/>
  <text x="75" y="415.5" text-anchor="start" font-size="12.5" font-weight="500" fill="#79460c">✓ daily quality: volume, profile</text>
  <rect x="48" y="452" width="314" height="64" rx="10" fill="#e3efdc" stroke="#54a630" stroke-width="2"/>
  <text x="64" y="477" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Hourly weather</text>
