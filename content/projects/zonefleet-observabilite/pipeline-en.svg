  <text x="443" y="202" text-anchor="start" font-size="17" font-weight="700" fill="#2e6218">Model</text>
  <rect x="820" y="174" width="350" height="398" rx="12" fill="#ffffff" stroke="#9fd08a" stroke-width="2"/>
  <text x="838" y="202" text-anchor="start" font-size="17" font-weight="700" fill="#2e6218">Monitoring</text>
