  <text x="50" y="78" text-anchor="start" font-size="17" font-weight="700" fill="#282c26">Sources</text>
  <rect x="170" y="44" width="235" height="56" rx="8" fill="#eceee9" stroke="#b5beb1" stroke-width="1.5"/>
  <text x="184" y="67" text-anchor="start" font-size="14.5" font-weight="700" fill="#282c26">TLC yellow and green taxis</text>
  <text x="184" y="88" text-anchor="start" font-size="12.5" fill="#5a6356">120 Parquet files, 3.6 GB</text>
  <rect x="420" y="44" width="235" height="56" rx="8" fill="#eceee9" stroke="#b5beb1" stroke-width="1.5"/>
  <text x="434" y="67" text-anchor="start" font-size="14.5" font-weight="700" fill="#282c26">TLC zones</text>
  <text x="434" y="88" text-anchor="start" font-size="12.5" fill="#5a6356">60 frozen zones out of 263</text>
  <rect x="670" y="44" width="235" height="56" rx="8" fill="#eceee9" stroke="#b5beb1" stroke-width="1.5"/>
  <text x="684" y="67" text-anchor="start" font-size="14.5" font-weight="700" fill="#282c26">Open-Meteo</text>
  <text x="684" y="88" text-anchor="start" font-size="12.5" fill="#5a6356">hourly weather, Times Square</text>
  <rect x="920" y="44" width="235" height="56" rx="8" fill="#eceee9" stroke="#b5beb1" stroke-width="1.5"/>
  <text x="934" y="67" text-anchor="start" font-size="14.5" font-weight="700" fill="#282c26">US calendar</text>
  <text x="934" y="88" text-anchor="start" font-size="12.5" fill="#5a6356">holidays, day of week</text>
  <rect x="18" y="140" width="1164" height="448" rx="14" fill="none" stroke="#2e6218" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1162" y="162" text-anchor="end" font-size="14" fill="#2e6218">Dagster · asset graph, a full run in about 20 s</text>
  <text x="1162" y="162" text-anchor="end" font-size="14" font-weight="700" fill="#2e6218" opacity="0">.</text>
