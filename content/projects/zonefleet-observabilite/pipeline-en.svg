  <rect x="838" y="216" width="314" height="84" rx="10" fill="#e3efdc" stroke="#54a630" stroke-width="2"/>
  <text x="854" y="241" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Daily signals</text>
  <text x="854" y="261" text-anchor="start" font-size="12.5" fill="#5a6356" font-family="'IBM Plex Mono', Consolas, monospace">monitoring_signals</text>
  <text x="854" y="281" text-anchor="start" font-size="13" fill="#3b4338">drift KS, PSI, PCA · DLE · realised</text>
