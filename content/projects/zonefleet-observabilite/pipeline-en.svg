  <rect x="443" y="318" width="314" height="84" rx="10" fill="#e3efdc" stroke="#54a630" stroke-width="2"/>
  <text x="459" y="343" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Champion model</text>
  <text x="459" y="363" text-anchor="start" font-size="12.5" fill="#5a6356" font-family="'IBM Plex Mono', Consolas, monospace">champion_model</text>
  <text x="459" y="383" text-anchor="start" font-size="13" fill="#3b4338">global LightGBM, 3 quantiles, frozen</text>
  <rect x="443" y="420" width="314" height="96" rx="10" fill="#e3efdc" stroke="#54a630" stroke-width="2"/>
  <text x="459" y="445" text-anchor="start" font-size="16" font-weight="700" fill="#282c26">Day-ahead forecasts</text>
  <text x="459" y="465" text-anchor="start" font-size="12.5" fill="#5a6356" font-family="'IBM Plex Mono', Consolas, monospace">predictions</text>
  <rect x="459" y="474" width="238" height="22" rx="11.0" fill="#fdf3dc" stroke="#e99d16" stroke-width="1.5"/>
  <text x="470" y="489.5" text-anchor="start" font-size="12.5" font-weight="500" fill="#79460c">✓ one forecast per zone and hour</text>
