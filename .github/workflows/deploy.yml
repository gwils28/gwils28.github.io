name: Déployer sur GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Permissions nécessaires au déploiement Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on laisse finir celle en cours
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Hugo (extended)
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          submodules: recursive # indispensable : le thème est un sous-module
          fetch-depth: 0 # pour les dates .Lastmod issues de git

      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Construire le site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --minify --gc \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Publier l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
