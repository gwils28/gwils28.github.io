# -- Configuration du site --
# Doc du thème : https://blowfish.page/docs/getting-started/

baseURL = "https://gwils28.github.io/"
theme = "blowfish"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false
enableEmoji = true
# .Lastmod = date du dernier commit qui touche la page (affichée sur les projets)
enableGitInfo = true

[pagination]
  pagerSize = 12

[imaging]
  anchor = "Center"

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

# -- Contenu lié ("articles similaires" en bas de chaque post) --
[related]
  threshold = 0
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 100

  [[related.indices]]
    name = "series"
    weight = 50

  [[related.indices]]
    name = "date"
    weight = 10
