# -- Options du thème Blowfish --
# Doc : https://blowfish.page/docs/configuration/#theme-parameters

# Palette sur mesure, définie dans assets/css/schemes/mousse.css
# (bâtie autour de #2E6218). Les palettes fournies par le thème restent
# disponibles : blowfish, avocado, fire, forest, neon, noir, slate…
colorScheme = "mousse"
defaultAppearance = "dark"
autoSwitchAppearance = true   # suit le réglage clair/sombre du système

enableSearch = true
enableCodeCopy = true         # bouton « copier » sur les blocs de code
enableA11y = true
enableStructuredBreadcrumbs = true

# Sections agrégées sur la page d'accueil et dans le flux RSS
mainSections = ["posts", "projects"]

disableImageOptimization = false
fingerprintAlgorithm = "sha512"

# Fond de page : estampe de Hokusai posée en calque fixe derrière tout le site.
# Le voile et le flou progressif au scroll sont réglés dans assets/css/custom.css.
defaultBackgroundImage = "img/hokusai-shichirigahama.jpg"
backgroundCanvas = true

[header]
  layout = "fixed-fill-blur"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "profile"          # photo + bio + liens, puis les articles récents
  showRecent = true
  showRecentItems = 5
  showMoreLink = true
  showMoreLinkDest = "posts/"
  cardView = true

# -- Pages d'article --
[article]
  showDate = true
  showDateUpdated = true
  showAuthor = true
  showBreadcrumbs = true
  showDraftLabel = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showWordCount = true
  showTableOfContents = true
  showTaxonomies = true
  showCategories = true
  showTags = true
  # Catégories en ambre, tags en vert : les deux taxonomies se distinguent
  # au coup d'œil, et c'est ce qui donne un rôle à la couleur secondaire.
  showCategoriesInSecondaryColor = true
  showRelatedContent = true
  relatedContentLimit = 3
  # Hero désactivé : sans image propre, Blowfish retombe sur
  # defaultBackgroundImage (cf. partials/hero/big.html), ce qui afficherait
  # l'estampe une seconde fois en haut de chaque article. Le fond de page
  # porte déjà l'identité visuelle.
  # Un article avec sa propre illustration peut le réactiver dans son front
  # matter : showHero: true + featureImage: "cover.jpg".
  showHero = false
  heroStyle = "big"
  sharingLinks = ["linkedin", "bluesky", "mastodon", "email"]
  # Lien « modifier cette page » — décommente une fois le dépôt en ligne
  # showEdit = true
  # editURL = "https://github.com/gwils28/gwils28.github.io/tree/master/"
  editAppendPath = true

# -- Pages de liste (/posts, /projects) --
[list]
  showHero = false
  showBreadcrumbs = true
  showSummary = true
  showTableOfContents = false
  groupByYear = true
  constrainItemsWidth = true

[taxonomy]
  showTermCount = true
  showBreadcrumbs = true

[term]
  showBreadcrumbs = true
  showTableOfContents = false

[sitemap]
  excludedKinds = ["taxonomy", "term"]

# Redirection automatique vers la langue du navigateur (site bilingue)
[languageRedirect]
  enabled = false
