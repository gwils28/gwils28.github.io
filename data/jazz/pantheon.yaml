# Onglet « Panthéon » de /jazz/pantheon/ : les musiciens et groupes admirés,
# une grande carte chacun, dans l'ordre de ce fichier.
#
#   nom      : musicien ou groupe
#   role     : instrument, formation, époque… (facultatif, { fr, en } possible)
#   dates    : années de vie, ex. "1935 – 1969" (facultatif)
#   image    : photo, dans assets/img/jazz/pantheon/ (recadrée en 4:5, jamais
#              agrandie, publiée en WebP, sans EXIF ; un portrait vertical
#              d'au moins 900 px de large est idéal)
#   cadrage  : zone gardée au recadrage (facultatif, Smart par défaut) :
#              Top, Bottom, Left, Right, Center, TopLeft, TopRight…
#   texte    : le témoignage, en Markdown ({ fr, en })

- nom: "Paul Chambers"
  role: { fr: "Contrebasse", en: "Double bass" }
  dates: "1935 – 1969"
  image: "paul-chambers.jpg"
  cadrage: "Top"
  texte:
    fr: >-
      Lorsque, enfant vers 7 ans, j'ai entendu les premières notes de sa ligne
      de basse sur "So What" à la radio, l'univers s'est figé, me plantant au
      cœur de cette certitude : j'entendais là l'une des expressions les plus
      abouties de l'art humain.
    en: >-
      When, as a child of about seven, I heard the first notes of his bass line
      on "So What" on the radio, the universe stood still and planted me at the
      heart of a certainty: I was hearing one of the most accomplished
      expressions of human art.

- nom: "Charles Mingus"
  role: { fr: "Contrebasse, composition", en: "Double bass, composition" }
  dates: "1922 – 1979"
  image: "charles-mingus.jpg"
  cadrage: "Top"
  texte:
    fr: >-
      Mon génie à moi : habité d'un charisme farouche et d'une science
      infaillible de l'écriture pour grand ensemble, qui me bouleverse
      profondément dans *Haitian Fight Song* et m'émerveille à travers sa
      composition big band de *Moanin'*.
    en: >-
      My own genius: possessed of a fierce charisma and an unerring mastery of
      writing for large ensembles, which shakes me to the core in *Haitian
      Fight Song* and fills me with wonder through his big band composition
      *Moanin'*.

- nom: "Endea Owens"
  role: { fr: "Contrebasse, composition", en: "Double bass, composition" }
  image: "endea-owens.webp"
  cadrage: "Center"
  texte:
    fr: >-
      Virtuosité foudroyante, énergie spectaculaire, et les frissons à chaque
      écoute de *For the People*, le plus beau des hymnes. Son message et son
      humanité m'ont marqué au point de transmettre à ma fille l'héritage de
      son joli prénom.
    en: >-
      Dazzling virtuosity, spectacular energy, and chills every time I listen
      to *For the People*, the most beautiful of anthems. Her message and her
      humanity moved me so deeply that I passed on to my daughter the legacy of
      her lovely first name.
